<!DOCTYPE html>
<html>
<head>
    <title>TheChuckList</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>TheChuckList</h1>

    <div class="top-bar">
        <button>Level List</button>
        <button>Leaderboard</button>
    </div>

    <div class="level-card">
        <h2>#1 Release</h2>
        <p>Verifier: Streef</p>
        <p>Points: 500</p>
    </div>

    <div class="level-card">
        <h2>#2 Static Void</h2>
        <p>Verifier: Chance</p>
        <p>Points: 470</p>
    </div>

    <div class="leaderboard">
        <h2>Top Players</h2>

        <div class="player">
            <span>#1 Streef</span>
            <span>0 pts</span>
        </div>

        <div class="player">
            <span>#2 Chance</span>
            <span>0 pts</span>
        </div>
    </div>

</body>
</html>
